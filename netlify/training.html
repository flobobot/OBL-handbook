
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>OBL Training</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="navbar-left">
      <strong>OBL Training</strong>
    </div>
    <div class="navbar-right">
      <a href="cocktail-manager.html">Cocktails</a>
      <a href="training.html">Training</a>
      <a href="#">Logout</a>
    </div>
  </nav>

  <div class="container">
    <h1>Welcome to Bartender Training</h1>
    <label>Select User Level:
      <select id="userLevelSelect">
        <option value="1">Level 1 – Trainee</option>
        <option value="2">Level 2 – Junior</option>
        <option value="3">Level 3 – Staff</option>
        <option value="4">Level 4 – Supervisor</option>
        <option value="5">Level 5 – Admin</option>
      </select>
    </label>

    <div id="moduleList" class="module-list"></div>
  </div>

  <script>
    const levelSelect = document.getElementById("userLevelSelect");
    const moduleList = document.getElementById("moduleList");

    levelSelect.value = localStorage.getItem("userLevel") || "1";
    levelSelect.addEventListener("change", () => {
      localStorage.setItem("userLevel", levelSelect.value);
      location.reload();
    });

    fetch("data/training_modules.json")
      .then(res => res.json())
      .then(data => {
        const userLevel = parseInt(localStorage.getItem("userLevel") || "1");
        data.forEach(mod => {
          if (userLevel >= mod.level) {
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `
              <h2>${mod.title}</h2>
              <p><a href="training-module.html?module=${mod.id}" class="button">Start Module</a></p>
            `;
            moduleList.appendChild(card);
          }
        });
      });
  </script>
</body>
</html>
