
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Training Module</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="navbar-left">
      <a href="training.html">← Back to Training</a>
    </div>
    <div class="navbar-right">
      <span>User Level: <span id="userLevel"></span></span>
    </div>
  </nav>

  <div class="main-container">
    <div class="card">
      <h1 id="moduleTitle">Loading...</h1>
      <div id="moduleContent" class="module-content"></div>
      <div id="adminTools" style="display:none; margin-top: 1rem;">
        <button onclick="editModule()">✏️ Edit Module</button>
      </div>
    </div>
  </div>

  <script>
    const level = parseInt(localStorage.getItem("userLevel") || "1", 10);
    document.getElementById("userLevel").textContent = level;

    const params = new URLSearchParams(window.location.search);
    const moduleId = params.get("module");
    let currentModule = null;

    fetch("data/training_modules.json")
      .then(res => res.json())
      .then(data => {
        const mod = data.find(m => m.id === moduleId);
        if (!mod) return document.getElementById("moduleTitle").textContent = "Module not found";

        currentModule = mod;
        document.title = `Training – ${mod.title}`;
        document.getElementById("moduleTitle").textContent = mod.title;
        document.getElementById("moduleContent").innerHTML = mod.content;

        if (level === 5) {
          document.getElementById("adminTools").style.display = "block";
        }
      });

    function editModule() {
      alert("Edit modal not yet wired.");
    }
  </script>
</body>
</html>
